<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="15%" r="70%">
      <stop offset="0" stop-color="#c9bfa7" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c9bfa7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0c"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- marco HUD -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#26262a" stroke-width="2"/>
  <rect x="48" y="48" width="60" height="4" fill="#c9bfa7"/>
  <rect x="48" y="48" width="4" height="60" fill="#c9bfa7"/>
  <rect x="1092" y="578" width="60" height="4" fill="#c9bfa7"/>
  <rect x="1148" y="522" width="4" height="60" fill="#c9bfa7"/>

  <!-- logo pixel -->
  <g fill="#c9bfa7" shape-rendering="crispEdges">
    <rect x="100" y="108" width="48" height="12"/>
    <rect x="100" y="120" width="12" height="12"/>
    <rect x="100" y="132" width="48" height="12"/>
    <rect x="136" y="144" width="12" height="12"/>
    <rect x="100" y="156" width="48" height="12"/>
  </g>
  <text x="168" y="152" font-family="Verdana,sans-serif" font-size="26" font-weight="bold"
        letter-spacing="4" fill="#9a978f">SOG77</text>

  <!-- nombre -->
  <text x="100" y="322" font-family="Verdana,sans-serif" font-size="86" font-weight="bold"
        letter-spacing="2" fill="#e9e7e2">SEBASTIAN</text>
  <text x="100" y="412" font-family="Verdana,sans-serif" font-size="86" font-weight="bold"
        letter-spacing="2" fill="none" stroke="#c9bfa7" stroke-width="1.6">OSPINA</text>

  <!-- clase -->
  <rect x="100" y="452" width="3" height="26" fill="#c9bfa7"/>
  <text x="118" y="473" font-family="Verdana,sans-serif" font-size="22" letter-spacing="3" fill="#c9bfa7">
    FULL STACK DEVELOPER
  </text>

  <text x="100" y="524" font-family="Verdana,sans-serif" font-size="19" fill="#9a978f">
    Python · Flask · React · TypeScript · PostgreSQL · Docker
  </text>

  <!-- barra de XP -->
  <rect x="820" y="452" width="280" height="14" fill="#0b0b0c" stroke="#34343a" stroke-width="1.5"/>
  <rect x="823" y="455" width="238" height="8" fill="#c9bfa7"/>
  <text x="820" y="440" font-family="Verdana,sans-serif" font-size="13" letter-spacing="3" fill="#6b6862">EN PRODUCCION</text>
</svg>
