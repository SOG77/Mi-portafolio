<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Página no encontrada</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;
    background:#07070c;color:#ececf5;font-family:'Inter',system-ui,sans-serif;
  }
  .glow{position:fixed;inset:0;pointer-events:none}
  .glow i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4}
  .glow i:first-child{width:420px;height:420px;background:#7c5cff;top:-120px;left:-80px}
  .glow i:last-child{width:380px;height:380px;background:#22d3ee;bottom:-140px;right:-60px;opacity:.25}
  main{position:relative;z-index:1}
  h1{
    font-family:'Space Grotesk',sans-serif;font-size:clamp(4rem,16vw,9rem);margin:0;line-height:1;
    background:linear-gradient(100deg,#7c5cff,#a78bfa,#22d3ee);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  p{color:#9a9ab5;margin:14px 0 30px;font-size:17px}
  code{font-family:'JetBrains Mono',monospace;font-size:13px;color:#c4b5fd}
  a{
    display:inline-flex;gap:9px;align-items:center;text-decoration:none;color:#0a0a10;font-weight:600;
    background:linear-gradient(100deg,#7c5cff,#22d3ee);padding:14px 28px;border-radius:100px;
    box-shadow:0 10px 30px rgba(124,92,255,.35);transition:transform .2s;
  }
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"><i></i><i></i></div>
  <main>
    <h1>404</h1>
    <p>Esta página no existe.<br><code>GET /ruta-desconocida → 404 Not Found</code></p>
    <a href="./">Volver al portafolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
