<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME OVER · Página no encontrada</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;
    background:#0b0b0c;color:#e9e7e2;font-family:'Chakra Petch',system-ui,sans-serif;
    background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .scanlines{
    position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  }
  main{position:relative;z-index:1;border:1px solid #26262a;background:#141416;padding:48px 40px;max-width:520px}
  .key{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;color:#6b6862;text-transform:uppercase}
  h1{
    font-family:'Press Start 2P',monospace;font-size:clamp(1.5rem,7vw,2.6rem);
    margin:22px 0 6px;color:#c9bfa7;line-height:1.4;
  }
  .sub{font-family:'Press Start 2P',monospace;font-size:10px;color:#9a978f;letter-spacing:.05em;margin-bottom:26px}
  p{color:#9a978f;margin:0 0 30px;font-size:15px}
  code{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9bfa7}
  a{
    display:inline-flex;gap:10px;align-items:center;text-decoration:none;color:#0b0b0c;
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;
    background:#c9bfa7;padding:14px 28px;box-shadow:4px 4px 0 rgba(201,191,167,.22);
    transition:transform .16s ease,box-shadow .16s ease,background .2s;
  }
  a:hover{background:#dedbd2;transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(201,191,167,.3)}
  a:active{transform:translate(2px,2px);box-shadow:none}
  a:focus-visible{outline:2px solid #c9bfa7;outline-offset:3px}
</style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main>
    <p class="key">Error 404</p>
    <h1>GAME OVER</h1>
    <p class="sub">CONTINUAR? &nbsp;SI / no</p>
    <p>Esta página no existe.<br><code>GET /ruta-desconocida → 404 Not Found</code></p>
    <a href="./"><span aria-hidden="true">▶</span> Volver al inicio</a>
  </main>
</body>
</html>
